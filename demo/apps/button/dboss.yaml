procfile:
  web:
    command: ./start.sh
    hosts:
      - button.lvh.me
    # Serves a realtime hub at http://button.lvh.me/socketio; /chat is a small app page using it,
    # /socketio/_test the built-in self-test.
    pubsub:
      path: /socketio
      test: true
    health: /up
autostart: button

# Any AuthCog account may sign in; the page shows the X-Dboss-User header dboss sets. A sign-in
# lasts 8 hours before AuthCog is asked again.
auth: ["*"]
session_ttl: 8h
